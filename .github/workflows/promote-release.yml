name: Promote QR Time release

# QR Time: turns a preview (pre-release) into the real release, so the app's updater offers it.
# Takes seconds: no rebuild, the same APKs that were tried are the ones that ship.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to promote, e.g. v1.2.4"
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Mark the release as the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --prerelease=false --latest --title "QR Time $TAG"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json tagName,isPrerelease,name
